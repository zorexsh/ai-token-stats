name: Bug
description: Something reads the wrong number, or the server will not start.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: The command you ran, and what came back.
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    attributes:
      label: Tool
      placeholder: claude, codex, opencode
    validations:
      required: true
